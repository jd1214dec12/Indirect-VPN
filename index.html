<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Void AI</title>
<style>
    body { 
        background: #050505; 
        color: #fff; 
        font-family: monospace; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
    }
    .chat-box { 
        width: 90%; 
        max-width: 500px; 
        height: 85vh; 
        display: flex; 
        flex-direction: column; 
        border: 1px solid #333; 
        border-radius: 12px; 
        background: #000; 
        overflow: hidden;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
    }
    
    .profile-header {
        display: flex;
        align-items: center;
        padding: 20px 25px;
        background: linear-gradient(180deg, #1a0000 0%, #000000 100%);
        border-bottom: 2px solid #ff0000;
        gap: 18px;
        position: relative;
    }
    .profile-header::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 40%;
        height: 2px;
        background: #fff;
        box-shadow: 0 0 10px #fff;
    }
    .profile-pic {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        border: 3px solid #ff0000;
        object-fit: cover;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        background: #111;
    }
    .profile-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .profile-name {
        font-weight: 900;
        font-size: 1.4rem;
        color: #fff;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(255, 0, 0, 0.8), 0 0 15px rgba(255, 0, 0, 0.4);
    }
    .profile-status {
        font-size: 0.8rem;
        color: #ff0000;
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    .status-dot {
        width: 10px;
        height: 10px;
        background: #ff0000;
        border-radius: 50%;
        box-shadow: 0 0 10px #ff0000;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
        70% { box-shadow: 0 0 0 8px rgba(255, 0, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    .messages { 
        flex: 1; 
        overflow-y: auto; 
        padding: 20px;
        display: flex; 
        flex-direction: column; 
        gap: 15px; 
        background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
    }
    .msg { 
        padding: 12px 18px; 
        border-radius: 10px; 
        max-width: 85%; 
        word-wrap: break-word; 
        line-height: 1.5;
        font-size: 0.95rem;
    }
    .user { 
        background: #1a1a1a; 
        border: 1px solid #333;
        align-self: flex-end; 
        border-bottom-right-radius: 2px;
        color: #ddd;
    }
    .ai { 
        background: #ff0000; 
        color: #000; 
        font-weight: 700;
        align-self: flex-start; 
        border-bottom-left-radius: 2px;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        border: 1px solid #ff4444;
    }

    .input-area { 
        display: flex; 
        gap: 10px; 
        padding: 15px 20px;
        background: #050505;
        border-top: 1px solid #222;
    }
    input { 
        flex: 1; 
        padding: 14px; 
        background: #111; 
        border: 1px solid #444; 
        color: #fff; 
        outline: none; 
        font-family: monospace; 
        border-radius: 8px;
        transition: 0.3s;
        font-size: 0.95rem;
    }
    input:focus {
        border-color: #ff0000;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }
    button { 
        padding: 14px 25px; 
        background: #ff0000; 
        color: #000; 
        border: none; 
        font-weight: 900; 
        border-radius: 8px;
        cursor: pointer; 
        font-family: monospace;
        transition: 0.3s;
        font-size: 0.95rem;
    }
    button:hover {
        background: #fff;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
</style>
</head>
<body>

<div class="chat-box">
    
    <div class="profile-header">
        <img src="https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=200&auto=format&fit=crop" alt="Shadow Void" class="profile-pic">
        <div class="profile-info">
            <div class="profile-name">SHADOW VOID</div>
            <div class="profile-status"><div class="status-dot"></div> ONLINE</div>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="msg ai">I am the void. I am listening. What do you seek?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Speak..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">SEND</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('userInput');
    const messagesDiv = document.getElementById('messages');
    const text = input.value.trim();
    if(!text) return;

    messagesDiv.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    messagesDiv.innerHTML += `<div class="msg ai" id="${loadingId}">...</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        
        document.getElementById(loadingId).remove();

        if(data.error) {
            messagesDiv.innerHTML += `<div class="msg ai" style="background:#900; color:#fff; border-color:#f00;">Error: ${data.error}</div>`;
        } else {
            messagesDiv.innerHTML += `<div class="msg ai">${data.reply}</div>`;
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

    } catch (error) {
        document.getElementById(loadingId).remove();
        messagesDiv.innerHTML += `<div class="msg ai" style="background:#900; color:#fff; border-color:#f00;">Connection failed.</div>`;
    }
}
</script>
</body>
</html>
