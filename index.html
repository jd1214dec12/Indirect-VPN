<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow AI - Groq</title>
<style>
    body { 
        background: #050505; 
        color: #fff; 
        font-family: monospace; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
    }
    .chat-box { 
        width: 90%; 
        max-width: 500px; 
        height: 85vh; 
        display: flex; 
        flex-direction: column; 
        border: 1px solid #333; 
        border-radius: 10px; 
        background: #000; 
        overflow: hidden;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
    }
    .profile-header {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        background: #0a0a0a;
        border-bottom: 1px solid #ff0000;
        gap: 15px;
    }
    .profile-pic {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid #ff0000;
        object-fit: cover;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }
    .profile-info {
        display: flex;
        flex-direction: column;
    }
    .profile-name {
        font-weight: bold;
        font-size: 1.1rem;
        color: #fff;
        letter-spacing: 1px;
    }
    .profile-status {
        font-size: 0.75rem;
        color: #ff0000;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .status-dot {
        width: 8px;
        height: 8px;
        background: #ff0000;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
        70% { box-shadow: 0 0 0 5px rgba(255, 0, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }
    .messages { 
        flex: 1; 
        overflow-y: auto; 
        padding: 20px;
        display: flex; 
        flex-direction: column; 
        gap: 15px; 
    }
    .msg { 
        padding: 12px 16px; 
        border-radius: 8px; 
        max-width: 85%; 
        word-wrap: break-word; 
        line-height: 1.4;
        font-size: 0.9rem;
    }
    .user { 
        background: #1a1a1a; 
        border: 1px solid #333;
        align-self: flex-end; 
        border-bottom-right-radius: 0;
    }
    .ai { 
        background: #ff0000; 
        color: #000; 
        font-weight: bold;
        align-self: flex-start; 
        border-bottom-left-radius: 0;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }
    .input-area { 
        display: flex; 
        gap: 10px; 
        padding: 15px;
        background: #0a0a0a;
        border-top: 1px solid #222;
    }
    input { 
        flex: 1; 
        padding: 12px; 
        background: #111; 
        border: 1px solid #333; 
        color: #fff; 
        outline: none; 
        font-family: monospace; 
        border-radius: 5px;
        transition: 0.3s;
    }
    input:focus {
        border-color: #ff0000;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }
    button { 
        padding: 12px 20px; 
        background: #ff0000; 
        color: #000; 
        border: none; 
        font-weight: bold; 
        border-radius: 5px;
        cursor: pointer; 
        font-family: monospace;
        transition: 0.3s;
    }
    button:hover {
        background: #cc0000;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }
</style>
</head>
<body>

<div class="chat-box">
    
    <div class="profile-header">
        <img src="https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=100&auto=format&fit=crop" alt="Shadow Profile" class="profile-pic">
        <div class="profile-info">
            <div class="profile-name">SHΔDØW CORE</div>
            <div class="profile-status"><div class="status-dot"></div> Online & Ready</div>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="msg ai">Hi, motherfucker. Ready to work? Drop your command.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type message..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('userInput');
    const messagesDiv = document.getElementById('messages');
    const text = input.value.trim();
    if(!text) return;

    messagesDiv.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    messagesDiv.innerHTML += `<div class="msg ai" id="${loadingId}">...</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        
        document.getElementById(loadingId).remove();

        if(data.error) {
            messagesDiv.innerHTML += `<div class="msg ai" style="background:#900">Error: ${data.error}</div>`;
        } else {
            messagesDiv.innerHTML += `<div class="msg ai">${data.reply}</div>`;
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

    } catch (error) {
        document.getElementById(loadingId).remove();
        messagesDiv.innerHTML += `<div class="msg ai" style="background:#900">Error connecting to AI core.</div>`;
    }
}
</script>
</body>
</html>
